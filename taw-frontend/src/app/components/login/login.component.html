<div class="row justify-content-center mt-5">
  <div class="col-md-6 col-lg-4">
    <div class="card shadow border-0">
      <div class="card-header bg-primary text-white text-center">
        <h4 class="m-0">Accedi</h4>
      </div>
      <div class="card-body p-4">
        
        <div *ngIf="errorMessage" class="alert alert-danger text-center">
          {{ errorMessage }}
        </div>

        <form (ngSubmit)="onLogin()">
          <div class="mb-3">
            <label class="form-label text-muted small">Email</label>
            <input type="email" [(ngModel)]="email" name="email" class="form-control" placeholder="nome@esempio.it" required>
          </div>

          <div class="mb-3">
            <label class="form-label text-muted small">Password</label>
            <input type="password" [(ngModel)]="password" name="password" class="form-control" required>
          </div>

          <button type="submit" class="btn btn-primary w-100 fw-bold">Login</button>
        </form>

        <div class="mt-4 text-center border-top pt-3">
          <small class="text-muted">Non hai un account?</small><br>
          <a routerLink="/register" class="btn btn-outline-success btn-sm mt-2">
            📝 Registrati come Passeggero
          </a>
        </div>

      </div>
    </div>
  </div>
</div>
