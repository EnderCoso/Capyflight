<div class="container mt-5 mb-5">
  <div class="card shadow p-4 mx-auto border-0" style="max-width: 500px;">
    <h3 class="mb-4 text-center text-primary fw-bold">📝 Registrazione Passeggero</h3>
    
    <form (ngSubmit)="register()">
      <div class="row mb-3">
        <div class="col">
          <label class="small text-muted">Nome</label>
          <input type="text" class="form-control" [(ngModel)]="user.name" name="name" required>
        </div>
        <div class="col">
          <label class="small text-muted">Cognome</label>
          <input type="text" class="form-control" [(ngModel)]="user.surname" name="surname" required>
        </div>
      </div>

      <div class="mb-3">
        <label class="small text-muted">Data di Nascita</label>
        <input type="date" class="form-control" [(ngModel)]="user.birthDate" name="dob" required>
      </div>

      <div class="mb-3">
        <label class="small text-muted">Email</label>
        <input type="email" class="form-control" placeholder="name@example.com" [(ngModel)]="user.email" name="email" required>
      </div>

      <div class="mb-3">
        <label class="small text-muted">Password</label>
        <input type="password" class="form-control" placeholder="********" [(ngModel)]="user.password" name="pw" required>
      </div>

      <button type="submit" class="btn btn-primary w-100 fw-bold py-2">Registrati Ora</button>
    </form>

    <div class="mt-3 text-center">
      <small>Hai già un account? <a routerLink="/login" class="text-decoration-none">Accedi qui</a></small>
    </div>
  </div>
</div>
